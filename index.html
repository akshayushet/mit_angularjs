<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <title>Student Management Application</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 700px;
            margin: auto;
            border-radius: 10px;
        }

        h1, h2 {
            color: #234a7c;
        }

        input {
            padding: 10px;
            margin: 8px 0;
            width: 95%;
        }

        button {
            padding: 10px 15px;
            margin: 8px 5px;
            background-color: #2563a6;
            color: white;
            border: none;
            cursor: pointer;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .details {
            background: #eeeeee;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container" ng-controller="CollegeController">

    <h1>{{ collegeName }}</h1>
    <h2>Student Management Mini Application</h2>

    <div ng-controller="StudentController">

        <h2>Student Entry Form</h2>

        <label>Student Name:</label>
        <input type="text" ng-model="studentName"
               placeholder="Enter student name">

        <label>Department:</label>
        <input type="text" ng-model="department"
               placeholder="Enter department">

        <label>Semester:</label>
        <input type="number" ng-model="semester"
               placeholder="Enter semester">

        <label>Examination Marks:</label>
        <input type="number" ng-model="marks"
               placeholder="Enter marks">

        <br>

        <button ng-click="addStudent()">Add Student</button>

        <button ng-click="showDetails = !showDetails">
            {{ showDetails ? 'Hide Details' : 'Show Details' }}
        </button>

        <h2>Student List</h2>

        <ul>
            <li ng-repeat="student in students">
                {{ student }}
            </li>
        </ul>

        <div class="details" ng-show="showDetails">

            <h2>Student Details</h2>

            <p>Name: {{ studentName }}</p>
            <p>Department: {{ department }}</p>
            <p>Semester: {{ semester }}</p>
            <p>Marks: {{ marks }}</p>

        </div>

        <h2>Examination Result</h2>

        <p ng-if="marks >= 40"
           ng-class="{'pass': marks >= 40, 'fail': marks < 40}">
            Pass
        </p>

        <p ng-if="marks < 40 && marks != null"
           ng-class="{'pass': marks >= 40, 'fail': marks < 40}">
            Needs Improvement
        </p>

    </div>

</div>

</body>
</html>
